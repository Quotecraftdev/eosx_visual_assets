<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 300" width="100%" role="img" aria-label="Energy OSX — Market Intelligence banner">
  <title>Energy OSX — Market Intelligence</title>
  <desc>Dark navy banner: the Energy OSX platform lockup with the strapline "The operating layer for energy intelligence" and the domains Operational / Commercial / Financial on the left; the Market Intelligence identity with its glyph and the line "POSITION. GAP. WIN." on the right.</desc>
  <defs>
    <linearGradient id="eosxG" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00%" stop-color="#031A3A"/><stop offset="55.00%" stop-color="#04213F"/><stop offset="100.00%" stop-color="#0A5C63"/></linearGradient>
  </defs>

  <rect x="0" y="0" width="1440" height="300" rx="20" fill="url(#eosxG)"/>

  <!-- Left: platform lockup + strapline -->
  <text x="64" y="74" font-family='"Inter", "DejaVu Sans", sans-serif' font-size="20" font-weight="600" letter-spacing="2.6" fill="#7FBFC8">ENERGY OSX</text>

  <text x="64" y="142" font-family='"Manrope", "DejaVu Sans", sans-serif' font-size="52" font-weight="600" fill="#FFFFFF">The operating layer</text>
  <text x="64" y="200" font-family='"Manrope", "DejaVu Sans", sans-serif' font-size="52" font-weight="600"><tspan fill="#FFFFFF">for </tspan><tspan fill="#35C5C5">energy intelligence</tspan></text>

  <text x="64" y="250" font-family='"Inter", "DejaVu Sans", sans-serif' font-size="21" letter-spacing="0.4" fill="#8FA6BC">Operational · Commercial · Financial</text>

  <!-- Divider -->
  <line x1="792" y1="64" x2="792" y2="236" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>

  <!-- Right: app identity -->
  <g transform="translate(974.4 109.0) scale(1.0455)"><g><circle cx="22" cy="22" r="15" fill="none" stroke="#35C5C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="22" cy="22" r="8.5" fill="none" stroke="#35C5C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="22" cy="22" r="3" fill="#35C5C5" stroke="none"/></g></g>
  <text x="1038.4" y="146" font-family='"Manrope", "DejaVu Sans", sans-serif' font-size="40" font-weight="600" fill="#FFFFFF">Market Intelligence</text>
  <text x="1376" y="184" text-anchor="end" font-family='"Inter", "DejaVu Sans", sans-serif' font-size="19" font-weight="600" letter-spacing="3.0" fill="#7FBFC8">POSITION. GAP. WIN.</text>
</svg>
