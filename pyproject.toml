[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eosx-visual-assets"
version = "0.2.0"
description = "Shared brand and visual-asset library for the Energy OSX platform (banners, favicons, tokens)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Energy OSX" }]
dependencies = [
    "pillow>=10.0",
]

[project.optional-dependencies]
render = [
    "cairosvg>=2.7",
]
dev = [
    "pytest",
    "ruff",
    "cairosvg>=2.7",
]

[project.scripts]
eosx-assets-build = "eosx_visual_assets.build:main"

[project.urls]
Repository = "https://github.com/Quotecraftdev/eosx_visual_assets"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"eosx_visual_assets" = ["assets/fonts/*.ttf"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["eosx_visual_assets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
